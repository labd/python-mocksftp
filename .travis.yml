---
sudo: false
language: python

matrix:
  include:
    - python: "3.11"
      env: TOXENV=py311
    - python: "3.12"
      env: TOXENV=py312
    - python: "3.13"
      env: TOXENV=py313
    - python: "3.14"
      env: TOXENV=py314

before_cache:
  - rm -rf $HOME/.cache/pip/log

cache:
  directories:
    - $HOME/.cache/pip

deps:
  - codecov

install:
  - pip install -U pip tox codecov

script:
  - tox -e $TOXENV

after_success:
  - tox -e coverage-report
  - codecov

notifications:
  email: false
