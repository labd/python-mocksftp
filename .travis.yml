---
sudo: false
language: python

matrix:
  include:
    - python: "3.11"
      env: TOXENV=py311
    - python: "3.12"
      env: TOXENV=py312
    - python: "3.13"
      env: TOXENV=py313
    - python: "3.14"
      env: TOXENV=py314
    - python: "3.13"
      env: TOXENV=lint

before_cache:
  - rm -rf $HOME/.cache/pip/log

cache:
  directories:
    - $HOME/.cache/pip

install:
  - pip install -U pip tox

script:
  - tox -e $TOXENV

notifications:
  email: false
